version: "3.9"

# Run from the docker/ folder: `docker compose --env-file .env up --build`
# (copy .env.example to .env first). See docs/setup.md and the root README.
#
# This is the production-like path (real PostgreSQL). Local dev without Docker uses
# SQLite by default — see docs/database.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      INGEST_API_KEY: ${INGEST_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "4000:4000"

  ai-service:
    build:
      context: ..
      dockerfile: ai-service/Dockerfile
    restart: unless-stopped
    environment:
      DETECTION_ADAPTER: yolov8
      BACKEND_URL: http://backend:4000
      INGEST_API_KEY: ${INGEST_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - backend

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Optional: file/RTSP ingestion (not webcam — see video-processing/Dockerfile). Not
  # started by a plain `docker compose up`; run explicitly, e.g.:
  #   docker compose --profile ingestion run --rm video-processing \
  #     --camera-id <id> --source file --path /data/demo.mp4
  # Mount your demo video(s) into ./data (bind-mounted below) first.
  video-processing:
    profiles: ["ingestion"]
    build:
      context: ..
      dockerfile: video-processing/Dockerfile
    environment:
      AI_SERVICE_URL: http://ai-service:8000
    volumes:
      - ./data:/data
    depends_on:
      - ai-service

volumes:
  pgdata:
